name: Sync Blocklist Sources

on:
  schedule:
    - cron: "0 0 * * 0"   # Jalan otomatis tiap Minggu jam 00:00 UTC
  workflow_dispatch:       # Bisa dijalankan manual

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download external blocklists
        run: |
          mkdir -p filters/blocklist
          
          # 1. Download Hagezi Ultimate (Sumber Utama)
          curl -sL https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/domains/ultimate.txt > filters/blocklist/ultimate.txt

          # 2. Download OISD SMALL (Disimpan terpisah)
          curl -sL https://raw.githubusercontent.com/cbuijs/oisd/refs/heads/master/small/domains > filters/blocklist/oisd-small.txt

      - name: Commit & Push changes
        run: |
          git config --global user.name "RifqyBot"
          git config --global user.email "bot@rifqyshield.local"
          
          # Update hanya file ultimate.txt dan oisd-small.txt
          git add filters/blocklist/ultimate.txt filters/blocklist/oisd-small.txt
          
          git commit -m "Sync: Hagezi Ultimate + OISD Small" || echo "No changes to commit"
          git push
